    <h1>大肥鱼 · 角色与动作</h1>
    <p>角色原型「溟月」由上善无形创作，女仆鲸鱼娘由 ZipZipPipe 设计。桌宠动作来自 <a href="https://github.com/PC2005-cloud/dsh-pet">PC2005-cloud / dsh-pet</a>。</p>
    <p>待机动作采用「待机呼吸休闲」。其他动作包括「舞狮头」「吃白饭」「原地专心玩魔方」「轻快摇摆舞」「工作状态-思考冒泡」和「点击回应-元气挥手」。网页版本裁去透明留白，对齐角色的站姿，并调整动作的起止画面。动画采用 WebP 格式，静态模式使用各动作的代表画面。</p>
    <p>原角色和此改编素材均按<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans">知识共享署名－非商业性使用－相同方式共享 4.0</a>提供。<a href="https://github.com/PC2005-cloud/dsh-pet/tree/c25386848f70f6e40902e4376f6e7b1e196bc326/dsh-pet/assets/webm">查看原版动画</a></p>
  </main>
