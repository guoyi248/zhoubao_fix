# ── 开发环境 Compose ──────────────────────────────────────
name: weekly-report-dev

services:
  # ── 基础设施 ──────────────────────────────────────────
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly_app
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_app -d weekly_report"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav

volumes:
  pgdata:
  miniodata:
  clamavdata:
