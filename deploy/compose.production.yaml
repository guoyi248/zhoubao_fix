# ── 生产环境：一键启动全部 8 个容器 ──
# docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml up -d
# 前端 http://<服务器IP>:80
# API   http://<服务器IP>:80/api/v1/

name: weekly-report

services:
  # ── Nginx: HTTPS + Vue 静态文件 + API 代理 ──
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend

  # ── API: Django + Gunicorn ──────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60
    env_file:
      - config/app.env
    secrets:
      - django_secret_key
      - postgres_password
      - s3_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=256m

  # ── Worker: Core ────────────────────────────────────
  worker-core:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q default,ai --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=100 --loglevel=INFO
    env_file:
      - config/app.env
    secrets:
      - django_secret_key
      - postgres_password
      - s3_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=256m

  # ── Worker: Preview ─────────────────────────────────
  worker-preview:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q preview --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=10 --loglevel=INFO
    env_file:
      - config/app.env
    secrets:
      - django_secret_key
      - postgres_password
      - s3_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fonts:/usr/local/share/fonts/company:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 6g
    cpus: 4.0
    tmpfs:
      - /tmp:size=2g
      - /work:size=2g

  # ── Postgres ────────────────────────────────────────
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_app -d weekly_report"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MinIO ───────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ../data/minio:/data
    expose:
      - "9000"
    networks:
      - backend

  # ── ClamAV ──────────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - ../data/clamav:/var/lib/clamav
    expose:
      - "3310"
    networks:
      - backend

  # ── Gotenberg ───────────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  postgres_password:
    file: ./secrets/postgres_password
  s3_secret_key:
    file: ./secrets/s3_secret_key
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
