# ── 生产环境 ──
name: weekly-report

x-background: &background
  restart: unless-stopped
  env_file: ./config/app.env
  volumes:
    - ../backend:/app/backend:ro
    - ./secrets/django:/run/secrets/weekly-django:ro
  networks: [backend]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  worker:
    <<: *background
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command: celery -A config worker -Q default,preview,ai --concurrency=2 --loglevel=INFO

  scheduler:
    <<: *background
    image: weekly-report-api:local
    command: celery -A config beat --schedule=/tmp/weekly-beat --loglevel=INFO

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "9527:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend

  api:
    image: weekly-report-api:local
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    env_file:
      - ./config/app.env
    environment:
      AUDIT_TRUSTED_PROXY_HOSTS: ${AUDIT_TRUSTED_PROXY_HOSTS:-nginx}
    volumes:
      - ../backend:/app/backend:ro
      - ./secrets/django:/run/secrets/weekly-django:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_app -d weekly_report"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["bundled-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ../data/minio:/data
    networks:
      - backend

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - ../data/clamav:/var/lib/clamav
    networks:
      - backend

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=120s"]
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
  backend:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
