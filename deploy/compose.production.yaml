# ── 生产环境：使用已拉取的镜像，不构建自定义镜像 ──
name: weekly-report

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9527:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - frontend
      - backend

  api:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ..:/app:ro
    networks:
      - backend
      - frontend

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_app -d weekly_report"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ../data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9100:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hjy
      MINIO_ROOT_PASSWORD: hjy12345678
    volumes:
      - ../data/minio:/data
    networks:
      - backend

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - ../data/clamav:/var/lib/clamav
    networks:
      - backend

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
