# ── 生产环境：使用已拉取的镜像，不构建自定义镜像 ──
name: weekly-report

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9527:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - frontend
      - backend

  api:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ..:/app:ro
    networks:
      - backend
      - frontend

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_app -d weekly_report"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - ../data/clamav:/var/lib/clamav
    networks:
      - backend

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
